[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talos"
version = "0.2.0"
description = "Modular simulation and experiment infrastructure for brain-inspired AI research"
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
erl = "erl.cli:main"

[tool.setuptools]
packages = ["erl"]
